<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#173b36"><style>
:root{--ink:#18332e;--green:#1d5147;--paper:#f2f2eb;--line:#dfe5da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:66px;background:#173b36;color:#fff;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0}.top small{display:block;color:#c2d1c5;font-size:11px;margin-top:3px}.top button{margin-left:auto}.wrap{max-width:1400px;margin:auto;padding:28px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.welcome h1{margin:7px 0;font-size:clamp(25px,4vw,38px)}.muted{color:#65756e}.action,.pill{border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px 16px}.grid{display:grid;grid-template-columns:1.4fr .7fr;gap:16px}.panel{background:#fffefa;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px #18332e0b}.panel h2{font-size:17px;margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fbfcf8;border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;color:var(--ink);min-height:82px}.card small{display:block;color:#68786f;font-size:12px;margin-top:8px}.resume{background:#eef2e8;border-radius:14px;padding:16px;line-height:1.9}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.subtle{background:#e9eee5;color:var(--ink)}.reader{display:none;position:fixed;inset:0;background:#edf0eb;z-index:5;flex-direction:column}.reader.open{display:flex}.rhead{height:58px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line)}.rhead strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.rhead button,.searchbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;color:var(--ink)}.rbody{display:grid;grid-template-columns:280px 1fr;gap:10px;padding:10px;min-height:0;flex:1}.side{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;overflow:auto}.side h2{font-size:16px;margin:0 0 12px}.side button{width:100%;display:block;text-align:left;border:0;border-radius:10px;background:#f4f6f0;margin:7px 0;padding:12px;color:var(--ink)}.pdf{width:100%;height:100%;border:0;border-radius:14px;background:#dfe5df}.overlay{position:fixed;inset:0;background:#112b278c;z-index:8;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(480px,100%);background:#fff;border-radius:18px;padding:22px}.modal button{border:0;background:#f2f5ef;border-radius:10px;padding:11px;margin:5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b36;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:10}@media(max-width:760px){.wrap{padding:19px 14px}.welcome{align-items:flex-start;flex-direction:column}.welcome .action{width:100%}.grid,.cards{grid-template-columns:1fr}.rbody{grid-template-columns:1fr;grid-template-rows:minmax(130px,24%) 1fr;padding:7px}.side{padding:10px}.side button{display:inline-block;width:auto;padding:9px;margin:4px}.rhead{height:54px;padding:0 6px;gap:4px}.rhead button{padding:7px;font-size:12px}.rhead strong{font-size:12px}}
</style></head><body><header class="top"><span style="font-size:24px;color:#d4dfaa">◈</span><div><b>南鳳山館・現勘審查手冊</b><small>互動式電子閱覽｜iPad 最佳化</small></div><button class="pill" onclick="showBookmarks()">☆ 書籤</button></header><main class="wrap"><div class="welcome"><div><div class="muted">高雄寶殿南鳳山館</div><h1>現勘審查互動手冊</h1><div class="muted">526 頁年度資料，支援快速跳頁、續讀與個人書籤。</div></div><button class="action" onclick="openReader(state.page||2)">繼續上次閱讀　›</button></div><div class="grid"><section class="panel"><h2>依主題開始閱讀</h2><div class="cards" id="cards"></div></section><section class="panel"><h2>閱讀進度</h2><div class="resume"><b id="resumeTitle">尚未開始閱讀</b><br><span id="resumePage">從主題目錄選擇內容</span><div style="height:5px;background:#d6dfd4;border-radius:5px;margin:12px 0"><i id="progress" style="display:block;height:100%;background:#668660;width:0"></i></div><span class="muted">閱讀紀錄與書籤儲存在此裝置</span></div><div class="tools"><button class="action subtle" onclick="openReader(2)">開啟目錄</button><button class="action subtle" onclick="showBookmarks()">我的書籤</button><button class="action subtle" onclick="toggleFull()">全螢幕</button></div></section></div></main><section class="reader" id="reader"><div class="rhead"><button onclick="closeReader()">‹ 返回</button><strong id="rtitle">互動閱讀</strong><button onclick="step(-1)">上一頁</button><button onclick="bookmark()">☆ 書籤</button><button onclick="step(1)">下一頁</button><button onclick="openPdf()">↗</button></div><div class="rbody"><aside class="side"><h2>快速導覽</h2><input id="pageInput" type="number" min="1" max="526" placeholder="輸入頁碼" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px"><button class="searchbtn" style="width:100%;margin-top:6px" onclick="goInput()">前往頁碼</button><div id="sections"></div></aside><iframe class="pdf" id="pdf" title="手冊 PDF 閱讀器" allow="fullscreen"></iframe></div></section><div class="overlay" id="overlay" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal"><h2>我的書籤</h2><div id="marks"></div><button onclick="document.getElementById('overlay').classList.remove('show')">關閉</button></div></div><div class="toast" id="toast"></div><script>
const C={"title":"高雄寶殿南鳳山館｜現勘審查互動手冊","pageCount":526,"pdfFileIds":["1fDBxtkjEI6ecFzcl6dcfGCwUtzaUFNMF","1AytOrAikbHk3ZSSRzD3otIU8vfzUTeYZ","14dXGhMKxTs2yU-o9ep7VXnvEo2or59Sj","1jc-hWb-svWP3XeuNZOFDczCUEJ-dPAtJ","1erCTUAzBxG6FWzuhb2Bezv0I-6SX02uH","1pLv-6t05K8_eE-BTlO7UMxlsxCQK_PfP"],"volumeSize":90,"sections":[{"title":"現勘審查資料","page":2,"detail":"目錄、場域基本資料與審查文件"},{"title":"教育訓練與課程","page":5,"detail":"課程、教材與審查紀錄"},{"title":"112 年度活動成果","page":109,"detail":"112 年度場域活動紀錄"},{"title":"113 年度活動成果","page":121,"detail":"113 年度場域活動紀錄"},{"title":"114 年度活動成果","page":151,"detail":"114 年度場域活動紀錄"},{"title":"115 年度活動成果","page":228,"detail":"115 年度場域活動紀錄"},{"title":"113 年度志工服務","page":372,"detail":"113 年度服務與成果資料"},{"title":"114 年度志工服務","page":392,"detail":"114 年度服務與成果資料"},{"title":"115 年度志工服務","page":450,"detail":"115 年度服務與成果資料"}],"initialPage":1},KEY='nanfengshan-interactive-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{page:1,marks:[]}}catch(e){state={page:1,marks:[]}}let page=state.page||1;const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state));$('resumeTitle').textContent=state.title||'尚未開始閱讀';$('resumePage').textContent='第 '+(state.page||1)+' 頁／共 '+C.pageCount+' 頁';$('progress').style.width=Math.round((state.page||1)/C.pageCount*100)+'%'}
function pdfUrl(n){return 'https://drive.google.com/file/d/'+C.pdfFileIds[Math.floor((n-1)/C.volumeSize)]+'/preview#page='+(((n-1)%C.volumeSize)+1)}
function openReader(n,title){page=Math.max(1,Math.min(C.pageCount,Number(n)||1));state.page=page;state.title=title||'第 '+page+' 頁';save();$('reader').classList.add('open');$('rtitle').textContent=state.title+' · 第 '+page+' 頁';$('pdf').src=pdfUrl(page)}
function closeReader(){$('reader').classList.remove('open')}function step(d){openReader(page+d)}function goInput(){openReader($('pageInput').value)}function openPdf(){window.open(pdfUrl(page),'_blank')}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}
function bookmark(){state.marks=state.marks||[];if(!state.marks.some(x=>x.page===page))state.marks.unshift({page:page,title:state.title});save();toast('已加入第 '+page+' 頁書籤')}
function showBookmarks(){let root=$('marks');root.textContent='';let marks=state.marks||[];if(!marks.length)root.textContent='尚無書籤。閱讀時按「☆ 書籤」即可保存。';marks.forEach(x=>{let b=document.createElement('button');b.textContent='第 '+x.page+' 頁 · '+x.title;b.onclick=()=>{$('overlay').classList.remove('show');openReader(x.page,x.title)};root.appendChild(b)});$('overlay').classList.add('show')}
function makeButton(host,title,detail,n,card){let b=document.createElement('button');b.className=card?'card':'';let label=document.createElement(card?'strong':'span');label.textContent=title;b.appendChild(label);if(detail){let small=document.createElement('small');small.textContent=detail;b.appendChild(small)}b.onclick=()=>openReader(n,title);host.appendChild(b)}
C.sections.forEach(x=>{makeButton($('cards'),x.title,x.detail+' · 第 '+x.page+' 頁起',x.page,true);makeButton($('sections'),x.title,'第 '+x.page+' 頁',x.page,false)});save();if(C.initialPage>1)openReader(C.initialPage);
</script></body></html>
