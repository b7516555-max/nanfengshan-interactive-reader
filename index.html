<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#173b36"><style>

</style></head><body><header class="top"><div class="brandmark" aria-hidden="true">✿</div><div><b>南鳳山館・現勘審查手冊</b><small>互動式電子閱覽｜平板最佳化</small></div><button class="pill" onclick="showBookmarks()">☆ 書籤</button></header><main class="wrap"><section class="hero"><div class="hero-copy"><span class="eyebrow">高雄寶殿南鳳山館・年度典藏</span><h1>現勘審查<br>互動手冊</h1><p>把年度資料化成一場輕鬆好讀的翻閱旅程。選主題、記書籤、接續上次閱讀，審查資料一點就到。</p><button class="action" onclick="openReader(state.page||2)">繼續上次閱讀　›</button><div class="statrow"><span class="stat"><b>526</b>頁內容</span><span class="stat"><b>9</b>個閱讀主題</span><span class="stat">閱讀進度自動保存</span></div></div><svg class="hero-art" viewBox="0 0 520 300" role="img" aria-label="南鳳山館與年度手冊插畫"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bce7e5"/><stop offset="1" stop-color="#fff0bd"/></linearGradient><linearGradient id="roof" x1="0" x2="1"><stop stop-color="#e85e4d"/><stop offset="1" stop-color="#f5a43a"/></linearGradient></defs><circle cx="414" cy="67" r="39" fill="#f8c94f"/><path d="M0 224 Q110 140 220 220 T520 200 V300 H0Z" fill="#acd6aa"/><path d="M0 254 Q120 190 250 246 T520 220 V300 H0Z" fill="#6ca987"/><rect x="110" y="28" width="310" height="225" rx="24" fill="url(#sky)"/><path d="M110 206 Q220 157 420 200 V253 H110Z" fill="#b5daa4"/><path d="M175 158h180v83H175z" fill="#fff6df"/><path d="M158 159h214l-22-20H180z" fill="#c84d3f"/><path d="M145 142q30-11 56-38 25 26 50 26 25-1 45-24 26 28 59 36-53 10-105 2-52 9-105-2" fill="url(#roof)" stroke="#a84538" stroke-width="3"/><path d="M166 145q18 2 34-9m18 10q27 4 47-2m22 1q20 2 41-9m-3-17q-17 5-31-2m-41 6q-22 5-42-6" fill="none" stroke="#ffe38e" stroke-width="4" stroke-linecap="round"/><rect x="199" y="174" width="27" height="67" rx="13" fill="#df7657"/><rect x="253" y="174" width="27" height="67" rx="13" fill="#df7657"/><rect x="307" y="174" width="27" height="67" rx="13" fill="#df7657"/><path d="M188 174h149" stroke="#496f57" stroke-width="5"/><path d="M251 70c-1-26 19-36 36-35-3 22-15 3 ton class="action subtle" onclick="openReader(2)">開啟目錄</button><button class="action subtle" onclick="showBookmarks()">我的書籤</button><button class="action subtle" onclick="toggleFull()">全螢幕</button></div></section></div></main><section class="reader" id="reader"><div class="rhead"><button onclick="closeReader()">‹ 返回</button><strong id="rtitle">互動閱讀</strong><button onclick="step(-1)">上一頁</button><button onclick="bookmark()">☆ 書籤</button><button onclick="step(1)">下一頁</button><button onclick="openPdf()">↗</button></div><div class="rbody"><aside class="side"><h2>快速導覽</h2><div class="page-tools"><input id="pageInput" type="number" min="1" max="526" placeholder="輸入頁碼"><button class="searchbtn" onclick="goInput()">前往</button></div><div id="sections"></div></aside><iframe class="pdf" id="pdf" title="手冊 PDF 閱讀器" allow="fullscreen"></iframe></div></section><div class="overlay" id="overlay" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal"><h2>我的書籤</h2><div id="marks"></div><button onclick="document.getElementById('overlay').classList.remove('show')">關閉</button></div></div><div class="toast" id="toast"></div><script>
const C={"title":"高雄寶殿南鳳山館｜現勘審查互動手冊","pageCount":526,"pdfFileIds":["1fDBxtkjEI6ecFzcl6dcfGCwUtzaUFNMF","1AytOrAikbHk3ZSSRzD3otIU8vfzUTeYZ","14dXGhMKxTs2yU-o9ep7VXnvEo2or59Sj","1jc-hWb-svWP3XeuNZOFDczCUEJ-dPAtJ","1erCTUAzBxG6FWzuhb2Bezv0I-6SX02uH","1pLv-6t05K8_eE-BTlO7UMxlsxCQK_PfP"],"volumeSize":90,"sections":[{"title":"現勘審查資料","page":2,"detail":"目錄、場域基本資料與審查文件"},{"title":"教育訓練與課程","page":5,"detail":"課程、教材與審查紀錄"},{"title":"112 年度活動成果","page":109,"detail":"112 年度場域活動紀錄"},{"title":"113 年度活動成果","page":121,"detail":"113 年度場域活動紀錄"},{"title":"114 年度活動成果","page":151,"detail":"114 年度場域活動紀錄"},{"title":"115 年度活動成果","page":228,"detail":"115 年度場域活動紀錄"},{"title":"113 年度志工服務","page":372,"detail":"113 年度服務與成果資料"},{"title":"114 年度志工服務","page":392,"detail":"114 年度服務與成果資料"},{"title":"115 年度志工服務","page":450,"detail":"115 年度服務與成果資料"}],"initialPage":1},KEY='nanfengshan-interactive-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{page:1,marks:[]}}catch(e){state={page:1,marks:[]}}let page=state.page||1;const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state));$('resumeTitle').textContent=state.title||'尚未開始閱讀';$('resumePage').textContent='第 '+(state.page||1)+' 頁／共 '+C.pageCount+' 頁';$('progress').style.width=Math.round((state.page||1)/C.pageCount*100)+'%'}
function pdfUrl(n){return 'https://drive.google.com/file/d/'+C.pdfFileIds[Math.floor((n-1)/C.volumeSize)]+'/preview#page='+(((n-1)%C.volumeSize)+1)}
function openReader(n,title){page=Math.max(1,Math.min(C.pageCount,Number(n)||1));state.page=page;state.title=title||'第 '+page+' 頁';save();$('reader').classList.add('open');$('rtitle').textContent=state.title+' · 第 '+page+' 頁';$('pdf').src=pdfUrl(page)}
function closeReader(){$('reader').classList.remove('open')}function step(d){openReader(page+d)}function goInput(){openReader($('pageInput').value)}function openPdf(){window.open(pdfUrl(page),'_blank')}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}
function bookmark(){state.marks=state.marks||[];if(!state.marks.some(x=>x.page===page))state.marks.unshift({page:page,title:state.title});save();toast('已加入第 '+page+' 頁書籤')}
function showBookmarks(){let root=$('marks');root.textContent='';let marks=state.marks||[];if(!marks.length)root.textContent='尚無書籤。閱讀時按「☆ 書籤」即可保存。';marks.forEach(x=>{let b=document.createElement('button');b.textContent='第 '+x.page+' 頁 · '+x.title;b.onclick=()=>{$('overlay').classList.remove('show');openReader(x.page,x.title)};root.appendChild(b)});$('overlay').classList.add('show')}
